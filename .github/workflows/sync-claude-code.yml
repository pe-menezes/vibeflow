name: Sync universal plugin → vibeflow-claude

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/marketplace.json'
      - 'plugins/vibeflow/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/sync-claude-code.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vibeflow (source)
        uses: actions/checkout@v4
        with:
          path: vibeflow

      - name: Checkout vibeflow-claude (target)
        uses: actions/checkout@v4
        with:
          repository: pe-menezes/vibeflow-claude
          token: ${{ secrets.VIBEFLOW_CLAUDE_PAT }}
          path: vibeflow-claude

      - name: Sync files
        run: |
          # Remove old files (except .git)
          find vibeflow-claude -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          # Publish only the Claude-compatible view of the universal plugin.
          mkdir -p vibeflow-claude/.claude-plugin
          cp vibeflow/plugins/vibeflow/.claude-plugin/plugin.json vibeflow-claude/.claude-plugin/plugin.json
          cp -r vibeflow/plugins/vibeflow/skills vibeflow-claude/skills
          cp -r vibeflow/plugins/vibeflow/agents vibeflow-claude/agents
          cp vibeflow/plugins/vibeflow/README.md vibeflow-claude/README.md
          cp vibeflow/CHANGELOG.md vibeflow-claude/CHANGELOG.md
          cp vibeflow/LICENSE vibeflow-claude/LICENSE

          # The legacy repository exposes the plugin at its root, while the
          # monorepo catalog points at ./plugins/vibeflow.
          jq '(.plugins[] | select(.name == "vibeflow").source) = "./"' \
            vibeflow/.claude-plugin/marketplace.json \
            > vibeflow-claude/.claude-plugin/marketplace.json

      - name: Commit and push
        working-directory: vibeflow-claude
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync"
          else
            git commit -m "sync universal plugin from vibeflow @ ${{ github.sha }}"
            git push
          fi
